version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/env-starter
    binary: env-starter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

homebrew_casks:
  - name: env-starter
    repository:
      owner: adericbourg
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/adericbourg/env-starter
    description: Keyboard-driven TUI meta-launcher for developer environments
    license: GPL-3.0
    binaries:
      - env-starter
    # Helps `brew audit` pass when the download domain differs from the homepage.
    url:
      verified: github.com/adericbourg/env-starter/
    # The binary is unsigned/un-notarized: strip the quarantine bit on install
    # so macOS Gatekeeper does not block it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/env-starter"]
          end

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release: {}
