version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/env-starter
    binary: env-starter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

homebrew_casks:
  - name: env-starter
    repository:
      owner: adericbourg
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/adericbourg/env-starter
    description: Keyboard-driven TUI meta-launcher for developer environments
    license: GPL-3.0
    binaries:
      - env-starter
    # Helps `brew audit` pass when the download domain differs from the homepage.
    url:
      verified: github.com/adericbourg/env-starter/
    # The binary is unsigned/un-notarized: strip the quarantine bit on install
    # so macOS Gatekeeper does not block it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/env-starter"]
          end

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Generate an SPDX SBOM per archive (syft). Uploaded as release assets alongside
# checksums.txt. Additive supply-chain transparency; does not affect the
# cosign-signed self-update trust chain.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

# Sign checksums.txt with cosign so the self-updater can authenticate a release,
# not merely trust TLS to GitHub. Requires COSIGN_PRIVATE_KEY and COSIGN_PASSWORD
# in the release environment; the matching public key is embedded in the binary
# (internal/update/verify.go). See docs/releasing.md.
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--key=env://COSIGN_PRIVATE_KEY"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  disable: true

release: {}
