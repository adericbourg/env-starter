name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        # On PRs, format.yml auto-formats and commits back to the branch, so a
        # hard-fail here would remain red on the original commit even after the
        # fix lands. This check is kept as a backstop for main-branch pushes
        # and for fork PRs (where format.yml cannot push back).
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
