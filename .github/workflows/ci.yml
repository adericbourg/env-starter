name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        # On PRs, format.yml auto-formats and commits back to the branch, so a
        # hard-fail here would remain red on the original commit even after the
        # fix lands. This check is kept as a backstop for main-branch pushes
        # and for fork PRs (where format.yml cannot push back).
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Cross-compile release targets
        # Catch platform-specific build breaks before they reach the release matrix.
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=linux   GOARCH=arm64 go build ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

      - name: Check for known vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          # The repo is already checked out above; the action's own checkout
          # (bundled actions/checkout@v4.1.1) fails with a git 400 error on
          # current runner images, so skip it and reuse the existing working tree.
          repo-checkout: false
