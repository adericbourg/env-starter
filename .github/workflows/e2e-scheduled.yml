name: E2E Scheduled
# Actions are pinned to full commit SHAs (uses: owner/action@<sha> # vX) so a
# retagged or compromised action version cannot change what this workflow runs.
# Renovate maintains the pins via helpers:pinGitHubActionDigests.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      matrix:
        os: [ubuntu-slim, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: End-to-end
        run: ./e2e/e2e.sh
