# Runnable version of the README's minimal example, used to record
# docs/images/demo.gif (see demo.tape) and to let readers run it themselves.
#
# One service (Postgres, via Docker Compose) and one dependent task (a
# migration script) that only starts once Postgres accepts connections.
# Requirements — standard on a dev machine: Docker running and free port
# 5432.
env-starter:
  commands:
    - name: database
      type: service
      source:
        local: ./docs/examples/database
      run: docker compose up
      teardown: docker compose down
      readiness:
        tcp: "localhost:5432"
        timeout: 60s
        interval: 1s

    - name: migrate
      type: task
      source:
        local: ./docs/examples/migrate
      run: ./migrate.sh up

  environments:
    - name: my-app
      workflow:
        - command: database
        - command: migrate
          depends-on: [database]
