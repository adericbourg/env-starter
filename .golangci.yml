version: "2"

linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - gosec
  settings:
    gosec:
      excludes:
        # G204: subprocess launched with a variable string — by design.
        # This tool is a command launcher; Run/Setup/Teardown fields in the
        # user's config are intentionally passed to sh -c.
        - G204
        # G304: file path built from a variable — by design.
        # Config file paths, source download paths, and log file paths are all
        # user-supplied; they are validated at config-load time.
        - G304
        # G306: file created with os.Create (default 0666, limited by umask)
        # inside a 0700 temp directory during the update download flow.
        # The parent directory restricts access regardless of the file mode.
        - G306
        # G702: command injection via taint analysis — syscall.Exec(self, os.Args,
        # os.Environ()) in reexec_unix.go, where self = os.Executable() (the
        # program's own resolved path after a verified self-update). Not
        # user-tainted; same rationale as the already-excluded G204.
        - G702
        # G703: path traversal via taint analysis — os.Create/os.Open on paths
        # built internally inside a 0700 temp directory during the update flow.
        # Never raw user input; same rationale as the already-excluded G304.
        - G703
  exclusions:
    rules:
      # In tests, errcheck and gosec findings are intentionally suppressed:
      # - errcheck: test I/O (http.ResponseWriter.Write, ring-buffer writes,
      #   net.Listener.Close) is local and errors are non-actionable.
      # - gosec: test fixtures use relaxed dir permissions (G301), unchecked
      #   writes to in-process buffers (G104), and a benign int→int32 cast
      #   (G115) — none of these are actionable in a test context.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
